# Nixpacks Configuration for Railway Deployment
[phases.setup]
nixPkgs = ["python312", "gcc", "libgomp", "nodejs_20"]

[phases.install]
cmds = [
    "pip install --upgrade pip",
    "pip install -r requirements.txt",
    "cd frontend && npm install && npm run build"
]

[start]
cmd = "cd backend && PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT"

