# Nixpacks Configuration for Railway Deployment
[phases.setup]
nixPkgs = ["python312", "gcc", "libgomp"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -r ai-lottery-lab/requirements.txt"]

[start]
cmd = "cd ai-lottery-lab/backend && PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT"
